name: mobiflow-ai
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: mobiflow
      POSTGRES_USER: mobiflow_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:setup}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run npm run env:setup}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./apps/api/prisma/migrations/202609280001_enable_vector/migration.sql:/docker-entrypoint-initdb.d/20-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobiflow_owner -d mobiflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 1g
    cpus: 1
  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://mobiflow_app:${POSTGRES_APP_PASSWORD}@postgres:5432/mobiflow
      JWT_SECRET: ${JWT_SECRET:?Run npm run env:setup}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Run npm run env:setup}
      JWT_ISSUER: ${JWT_ISSUER:-mobiflow-ai}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mobiflow-web}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_SESSION_TTL_SECONDS: ${REFRESH_SESSION_TTL_SECONDS:-604800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AI_GENERATION_PROVIDER: ${AI_GENERATION_PROVIDER:-deepseek}
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-lexical}
      AI_LIVE_CALLS_ENABLED: ${AI_LIVE_CALLS_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BUDGET_USD: ${DEEPSEEK_BUDGET_USD:-0.25}
      DEEPSEEK_MAX_CALLS_PER_PROCESS: ${DEEPSEEK_MAX_CALLS_PER_PROCESS:-3}
      DEEPSEEK_MAX_REQUESTS_PER_MINUTE: ${DEEPSEEK_MAX_REQUESTS_PER_MINUTE:-2}
      DEEPSEEK_MAX_CONCURRENT_REQUESTS: 1
      DEEPSEEK_PRICE_CACHE_HIT_INPUT_PER_MILLION_USD: ${DEEPSEEK_PRICE_CACHE_HIT_INPUT_PER_MILLION_USD:-0.006}
      DEEPSEEK_PRICE_CACHE_MISS_INPUT_PER_MILLION_USD: ${DEEPSEEK_PRICE_CACHE_MISS_INPUT_PER_MILLION_USD:-0.30}
      DEEPSEEK_PRICE_OUTPUT_PER_MILLION_USD: ${DEEPSEEK_PRICE_OUTPUT_PER_MILLION_USD:-1.20}
      DEEPSEEK_PRICING_EFFECTIVE_DATE: ${DEEPSEEK_PRICING_EFFECTIVE_DATE:-2026-10-23}
      AI_AUTO_ANALYZE: ${AI_AUTO_ANALYZE:-true}
      AI_ATTEMPT_TIMEOUT_MS: ${AI_ATTEMPT_TIMEOUT_MS:-120000}
      AI_RUN_TIMEOUT_MS: ${AI_RUN_TIMEOUT_MS:-300000}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3:latest}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
      EMBEDDING_INDEX_REVISION: ${EMBEDDING_INDEX_REVISION:-m5.v1}
      KNOWLEDGE_STORAGE_ROOT: /app/storage/knowledge
      KNOWLEDGE_JOB_TIMEOUT_MS: ${KNOWLEDGE_JOB_TIMEOUT_MS:-600000}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_DISTANCE: ${RAG_MAX_DISTANCE:-0.50}
      RAG_CONTEXT_CHARS: ${RAG_CONTEXT_CHARS:-6000}
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-2000}
      SLA_ALERT_ENABLED: ${SLA_ALERT_ENABLED:-true}
      SLA_ALERT_EARLY_RATIO: ${SLA_ALERT_EARLY_RATIO:-0.5}
      SLA_ALERT_AT_RISK_ENABLED: ${SLA_ALERT_AT_RISK_ENABLED:-true}
      SLA_ALERT_BREACH_ENABLED: ${SLA_ALERT_BREACH_ENABLED:-true}
      SLA_ALERT_INTERVAL_SECONDS: ${SLA_ALERT_INTERVAL_SECONDS:-60}
      SLA_ALERT_BATCH_SIZE: ${SLA_ALERT_BATCH_SIZE:-100}
      SLA_ALERT_TIME_BUDGET_MS: ${SLA_ALERT_TIME_BUDGET_MS:-10000}
    ports: ["127.0.0.1:${API_PORT:-3001}:3001"]
    volumes: ["knowledge_data:/app/storage/knowledge"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args: { NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}" }
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on: { api: { condition: service_started } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
volumes:
  postgres_data:
  knowledge_data:
