name: mobiflow-ai
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: mobiflow
      POSTGRES_USER: mobiflow_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:setup}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run npm run env:setup}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./apps/api/prisma/migrations/202609280001_enable_vector/migration.sql:/docker-entrypoint-initdb.d/20-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobiflow_owner -d mobiflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 1g
    cpus: 1
  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://mobiflow_app:${POSTGRES_APP_PASSWORD}@postgres:5432/mobiflow
      JWT_SECRET: ${JWT_SECRET:?Run npm run env:setup}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Run npm run env:setup}
      JWT_ISSUER: ${JWT_ISSUER:-mobiflow-ai}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mobiflow-web}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_SESSION_TTL_SECONDS: ${REFRESH_SESSION_TTL_SECONDS:-604800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AI_PROVIDER: ollama
      AI_AUTO_ANALYZE: ${AI_AUTO_ANALYZE:-true}
      AI_ATTEMPT_TIMEOUT_MS: ${AI_ATTEMPT_TIMEOUT_MS:-120000}
      AI_RUN_TIMEOUT_MS: ${AI_RUN_TIMEOUT_MS:-300000}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Select installed model or unconfigured}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:?Select installed model or unconfigured}
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-2000}
    ports: ["127.0.0.1:3001:3001"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
    init: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args: { NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { api: { condition: service_started } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
    init: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
volumes:
  postgres_data:
