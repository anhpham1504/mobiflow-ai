services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: mobiflow-m24-verification-postgres
    environment:
      POSTGRES_DB: mobiflow
      POSTGRES_USER: mobiflow_owner
      POSTGRES_PASSWORD: ${M24_OWNER_PASSWORD:?Isolated runtime required}
      POSTGRES_APP_PASSWORD: ${M24_APP_PASSWORD:?Isolated runtime required}
    ports: ["127.0.0.1:55424:5432", "127.0.0.1:33024:33024"]
    volumes:
      - m24_postgres:/var/lib/postgresql/data
      - ../../docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ../../apps/api/prisma/migrations/202609280001_enable_vector/migration.sql:/docker-entrypoint-initdb.d/20-vector.sql:ro
    mem_limit: 1g
    cpus: 2
volumes:
  m24_postgres:
