services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: mobiflow-m22-verification-postgres
    environment:
      POSTGRES_DB: mobiflow
      POSTGRES_USER: mobiflow_owner
      POSTGRES_PASSWORD: ${M22_OWNER_PASSWORD:?Isolated runtime required}
      POSTGRES_APP_PASSWORD: ${M22_APP_PASSWORD:?Isolated runtime required}
    ports: ["127.0.0.1:55422:5432", "127.0.0.1:33022:33022", "127.0.0.1:33400:33400", "127.0.0.1:33401:33401"]
    volumes:
      - m22_postgres:/var/lib/postgresql/data
      - ../../docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ../../apps/api/prisma/migrations/202609280001_enable_vector/migration.sql:/docker-entrypoint-initdb.d/20-vector.sql:ro
    mem_limit: 1g
    cpus: 2
volumes:
  m22_postgres:
